spring.application.name=Stage_Spring

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Stage_Spring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:false}

# Logging
logging.level.org.springframework=INFO
logging.level.com.stage=DEBUG
